name: Translate RSS

on:
  schedule:
    # DeepSeek 峰谷计费（2026-08-17 起）：UTC 01:00-04:00 和 06:00-10:00 是峰时，
    # 价格是谷时的两倍（v4-flash 谷时 ¥1.5/¥4.5 每百万 token，峰时 ¥3/¥9）。
    # 这里只在谷时段跑，并且和峰时起点留出余量，避免运行过程中跨进峰时。
    # RSS 不要求实时，最大间隔 6 小时（UTC 04:00 → 10:00）。
    - cron: "0 0,4,10,11,13,15,17,19,21,23 * * *"
  workflow_dispatch:

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write

    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for RSSHub ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub is ready"
              break
            fi
            echo "Waiting for RSSHub... ($i)"
            sleep 2
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run translation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python translate_rss.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update translated feeds"

          # 另一个 workflow / PR merge 可能在此期间推到 main，重试 + rebase 兜住
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i rejected, rebasing on origin/main..."
            git pull --rebase origin main || git rebase --abort 2>/dev/null
            sleep $((i * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
