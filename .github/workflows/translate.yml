name: Translate RSS

on:
  schedule:
    # DeepSeek 峰谷计费：峰时是**北京时间周一至周五** 09:00-12:00、14:00-18:00，
    # 其余全部是谷时，谷时单价是峰时的一半。换算成 cron 用的 UTC 就是周一至周五
    # 01:00-04:00 和 06:00-10:00（北京时间减 8 小时，不跨日，所以星期几不用平移）。
    #
    # 工作日：避开两个峰时窗口，并且不排在峰时开始前一小时内（避免运行过程中跨进峰时）。
    # 代价是 UTC 04:00 → 10:00 有个 6 小时的空档，更新快的源靠 max_entries 兜住。
    - cron: "0 0,4,10,11,13,15,17,19,21,23 * * 1-5"
    # 周末全天都是谷时，没有需要避开的窗口，照原来的每 2 小时跑，把工作日的空档补上。
    - cron: "0 */2 * * 0,6"
  workflow_dispatch:

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write

    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for RSSHub ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub is ready"
              break
            fi
            echo "Waiting for RSSHub... ($i)"
            sleep 2
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run translation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python translate_rss.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update translated feeds"

          # 另一个 workflow / PR merge 可能在此期间推到 main，重试 + rebase 兜住
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i rejected, rebasing on origin/main..."
            git pull --rebase origin main || git rebase --abort 2>/dev/null
            sleep $((i * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
